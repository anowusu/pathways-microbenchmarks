# TPUMS nightly runtime comparison: McJAX vs Pathways (Louhi, Rapid) on
# TPU v5e 4x8, driven from inside the cluster by a CronJob.
#
#   kubectl apply -f automation/k8s/nightly_cronjob.yaml
#   kubectl create job --from=cronjob/tpums-nightly tpums-nightly-manual   # run now
#
# The KSA is bound to the GSA tpums-nightly@cloud-tpu-multipod-dev through
# Workload Identity (GCS bucket + BigQuery dataset writes); the Role lets the
# driver create and watch JobSets in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tpums-nightly
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: tpums-nightly@cloud-tpu-multipod-dev.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tpums-nightly
  namespace: default
rules:
  - apiGroups: ["jobset.x-k8s.io"]
    resources: ["jobsets"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tpums-nightly
  namespace: default
subjects:
  - kind: ServiceAccount
    name: tpums-nightly
    namespace: default
roleRef:
  kind: Role
  name: tpums-nightly
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tpums-nightly
  namespace: default
spec:
  # Hourly at minute 0 (UTC).
  schedule: "0 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 24
  failedJobsHistoryLimit: 12
  jobTemplate:
    spec:
      backoffLimit: 0
      # 15 JobSets, at most 3 in flight, 25 min each, one retry: under 5 h.
      activeDeadlineSeconds: 18000
      template:
        metadata:
          labels:
            app: tpums-nightly
        spec:
          serviceAccountName: tpums-nightly
          restartPolicy: Never
          nodeSelector:
            cloud.google.com/gke-nodepool: default-pool
          containers:
            - name: driver
              image: us-docker.pkg.dev/cloud-tpu-multipod-dev/pathways-dev/anowusu/tpums-nightly:latest
              imagePullPolicy: Always
              env:
                # Use the cl/1010067962 Louhi image (PJRT profiler registered)
                # until cl/1010067962 rolls out to cloud-pathways:latest.
                - name: TPUMS_LOUHI_SERVER_IMAGE
                  value: us-docker.pkg.dev/cloud-tpu-multipod-dev/pathways-dev/anowusu/server
                - name: TPUMS_LOUHI_PROXY_IMAGE
                  value: us-docker.pkg.dev/cloud-tpu-multipod-dev/pathways-dev/anowusu/proxy_server
                - name: TPUMS_LOUHI_VERSION
                  value: cl-1010067962
              args:
                - --cluster=pw-scale-test-v5e-32
                - --project=cloud-tpu-multipod-dev
                - --region=us-south1
                - --zone=us-south1-a
                - --namespace=default
                - --queue=multislice-queue
                # Empty: this cluster defines pod PriorityClasses only, no Kueue
                # WorkloadPriorityClasses, so the Kueue priority label is omitted.
                - --priority=
                # Pod PriorityClass (the cluster has very-low/low/medium/high/
                # very-high). Kueue derives the workload priority from it, and
                # it preempts lower-priority workloads within the ClusterQueue:
                # without it the benchmarks run at priority 0 and get preempted
                # by every other job on this shared cluster.
                - --pod-priority-class=medium
                - --suite-file=automation/canonical_suite_v5e.yaml
                - --runtimes=mcjax,louhi,rapid
                - --max-parallel=3
                - --timeout-minutes=25
                # A preempted or hung JobSet is deleted and resubmitted once.
                - --retries=1
                - --git-repo=https://github.com/anowusu/pathways-microbenchmarks.git
                - --git-branch=nightly
                - --docker-image=us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
                - --gcs-bucket=gs://cloud-pathways-staging/tpums-nightly
                - --bq-table=cloud-tpu-multipod-dev.tpums_nightly.run_summary_microbenchmarks
                - --upload-trace
                - --skip-cluster-credentials
                - --cleanup
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
                limits:
                  memory: 4Gi
