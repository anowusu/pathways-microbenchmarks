# HBM copy on a tpu7x 8x8x16 slice (2048 JAX devices); the sweep is
# that of configs/tpu7x/2x2x1/hbm.yaml.
benchmark:
  name: hbm
  xprof_timing: true
  params:
    warmup_tries: 2
    num_runs: 10
    dtype: bfloat16
    op_type: copy
  sweep:
    num_elements:
      start: 67108864
      end: 536870912
      multiplier: 2
