# All-to-all between slices over the data center network (DCN). The automation
# runs `dcn_*` benchmarks on 2 slices of this directory's topology (4x8).
benchmark:
  name: dcn_all_to_all
  xprof_timing: true
  params:
    warmup_tries: 2
    num_runs: 5
    dtype: bfloat16
  sweep:
    matrix_dim: [131072, 262144, 524288]
